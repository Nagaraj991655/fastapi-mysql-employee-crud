services:

  mysql:
    image: mysql:8.0
    container_name: employee_mysql
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: employee_db
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend

    container_name: employee_backend
    restart: always

    env_file:
      - ./backend/.env

    depends_on:
      - mysql

    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend

    depends_on:
      - backend

    container_name: employee_frontend

    ports:
      - "3000:3000"

volumes:
  mysql_data:
